#---------------------------------------------------------------------------
# GitHub Actions workflow — publish changed API Studio project folders and
# delete published MCPServer/LLM assets for deleted project files whenever
# changes are pushed to main or master.
#
# For OCP-hosted IDIG deployments that require JWT Bearer auth, this workflow
# obtains a short-lived access token via /api/v1/federated-login before
# calling the IDIG broker, instead of using Basic Auth directly.
#---------------------------------------------------------------------------

name: Publish API Studio changes to IDIG

on:
  push:
    branches:
      - main
      - master
      - dc-test
  workflow_dispatch:

env:
  IDIG_BROKER_HOST: apps.rosa.apic-d-v12e.bqrc.p3.openshiftapps.com
  PLATFORM_IDIG_PREFIX: idig

jobs:
  discover-changes:
    name: Discover changed files and deleted asset definitions
    runs-on: self-hosted
    outputs:
      changed_files: ${{ steps.difference.outputs.changed_files }}
      deleted_files_content: ${{ steps.difference.outputs.deleted_files_content }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need HEAD and HEAD~1 for the diff

      - name: Collect changed files and deleted file contents from previous commit
        id: difference
        run: |
          files=$(git diff --name-only HEAD~1 HEAD)
          deleted_files=$(git diff --diff-filter=D --name-only HEAD~1 HEAD)
          deleted_files_content='[]'

          if [ -n "$deleted_files" ]; then
            deleted_files_content=$(
              echo "$deleted_files" | while IFS= read -r file; do
                [ -n "$file" ] || continue
                content=$(git show "HEAD~1:$file" | base64 | tr -d '\n')
                printf '{"path":"%s","content":"%s"}\n' "$file" "$content"
              done | jq -R -s 'split("\n") | map(select(length > 0) | fromjson)'
            )
          fi

          files_oneline=$(echo "$files" | tr '\n' ' ' | sed 's/[[:space:]]*$//')
          echo "Changed files in this push: $files_oneline"
          echo "changed_files=$files_oneline" >> "$GITHUB_OUTPUT"
          echo "deleted_files_content<<EOF" >> "$GITHUB_OUTPUT"
          echo "$deleted_files_content" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  publish-changes:
    name: Publish changed folders and delete removed published assets
    runs-on: self-hosted
    needs: discover-changes
    steps:
      - uses: actions/checkout@v4

      - name: Get IDIG Bearer token
        id: auth
        run: |
          # Use jq to build JSON body — avoids shell expansion of special
          # characters (e.g. $ { }) that may appear in the password.
          LOGIN_BODY=$(jq -cn \
            --arg u "${{ secrets.IDIG_USERNAME2 }}" \
            --arg p "${{ secrets.IDIG_PASSWORD2 }}" \
            '{username:$u,password:$p}')
          HEADERS=$(curl -k -s -o /dev/null -D - \
            https://${{ env.PLATFORM_IDIG_PREFIX }}.${{ env.IDIG_BROKER_HOST }}/api/v1/federated-login \
            -H 'Content-Type: application/json' \
            -d "$LOGIN_BODY")
          echo "--- response headers (cookie values redacted) ---"
          echo "$HEADERS" | sed 's/accesstoken=eyJ[^;]*/accesstoken=<redacted>/g' | sed 's/refreshtoken=eyJ[^;]*/refreshtoken=<redacted>/g'
          echo "--- end headers ---"
          TOKEN=$(echo "$HEADERS" \
            | grep -i 'set-cookie:.*accesstoken=' \
            | sed 's/.*accesstoken=\(eyJ[^;]*\).*/\1/' \
            | tr -d '\r')
          if [ -z "$TOKEN" ]; then
            echo "ERROR: Failed to obtain access token from federated login"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "idig_token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Publish changed project folders
        if: ${{ needs.discover-changes.outputs.changed_files != '' }}
        run: |
          FOLDERS=$(echo "${{ needs.discover-changes.outputs.changed_files }}" | \
            tr ' ' '\n' | awk -F/ 'NF>1{print $1}' | sort -u)
          if [ -z "$FOLDERS" ]; then
            echo "No project folders to publish"
            exit 0
          fi
          echo "Publishing folders: $FOLDERS"
          zip -r studioProjectFiles.zip $FOLDERS
          RESPONSE=$(curl -k -s \
            -H "Authorization: Bearer ${{ steps.auth.outputs.idig_token }}" \
            -H "Accept: application/json" \
            -F "project=@studioProjectFiles.zip;type=application/zip" \
            https://${{ env.PLATFORM_IDIG_PREFIX }}.${{ env.IDIG_BROKER_HOST }}/idig-broker/publish)
          echo "Publish response: $RESPONSE"
          STATUS=$(echo "$RESPONSE" | jq -r '.status // 0')
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ] && [ "$STATUS" != "304" ]; then
            echo "ERROR: Publish failed with status $STATUS"
            exit 1
          fi

      - name: Delete removed published assets
        if: ${{ needs.discover-changes.outputs.deleted_files_content != '[]' && needs.discover-changes.outputs.deleted_files_content != '' }}
        env:
          DELETED_FILES_CONTENT: ${{ needs.discover-changes.outputs.deleted_files_content }}
        run: |
          BODY=$(echo "$DELETED_FILES_CONTENT" | jq -c '
            reduce .[] as $f (
              {};
              ($f.content | @base64d) as $yaml |
              ($yaml | split("\n") | map(select(startswith("kind:"))) | .[0] | split(": ")[1] // "") as $kind |
              ($yaml | split("\n") | map(select(startswith("  namespace:"))) | .[0] | ltrimstr("  namespace: ") | ltrimstr(" ")) as $ns |
              ($yaml | split("\n") | map(select(startswith("  name:"))) | .[0] | ltrimstr("  name: ") | ltrimstr(" ")) as $name |
              ($yaml | split("\n") | map(select(startswith("  version:"))) | .[0] | ltrimstr("  version: ") | ltrimstr(" ") | gsub("\""; "")) as $ver |
              if ($kind == "MCPServer" or $kind == "LLM") and ($name != "") and ($ver != "") then
                .[$ns] //= {"mcpServers":[],"llms":[]} |
                if $kind == "MCPServer" then .[$ns].mcpServers += ["\($name):\($ver)"]
                else .[$ns].llms += ["\($name):\($ver)"] end
              else . end
            )
          ')
          if [ "$BODY" = "{}" ] || [ -z "$BODY" ]; then
            echo "No MCPServer or LLM assets to delete"
            exit 0
          fi
          echo "Delete request body: $BODY"
          RESPONSE=$(curl -k -s -X DELETE \
            -H "Authorization: Bearer ${{ steps.auth.outputs.idig_token }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "$BODY" \
            https://${{ env.PLATFORM_IDIG_PREFIX }}.${{ env.IDIG_BROKER_HOST }}/idig-broker/published-assets)
          echo "Delete response: $RESPONSE"
          STATUS=$(echo "$RESPONSE" | jq -r '.status // 0')
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ] && [ "$STATUS" != "304" ]; then
            echo "ERROR: Delete failed with status $STATUS"
            exit 1
          fi
