kind: OperationSwitch
apiVersion: api.ibm.com/v1
metadata:
  name: OperationSwitch-bjpi9
  namespace: TEST_LLM
  version: '1.0'
  tags: []
  labels:
    gatewayTypes:
      - nano
spec:
  cases:
    - conditions:
        - verbPath:
            path: /chat/completions
            verb: POST
      execute:
        - $ref: TEST_LLM:InvokeOpenAiChatCompletions-bjpi9:1.0
    - conditions:
        - verbPath:
            path: /embeddings
            verb: POST
      execute:
        - $ref: TEST_LLM:InvokeOpenAiEmbeddings-bjpi9:1.0
    - conditions:
        - verbPath:
            path: /models
            verb: GET
      execute:
        - $ref: TEST_LLM:InvokeOpenAiModels-bjpi9:1.0
    - conditions:
        - verbPath:
            path: /models/{a_model_id}
            verb: GET
      execute:
        - $ref: TEST_LLM:InvokeOpenAiModelsId-bjpi9:1.0
