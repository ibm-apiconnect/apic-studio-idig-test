  version: '1.0'
  tags: []
  domain: ai-platform
  labels:
    gatewayTypes:
      - nano
spec:
  inputMessage: request
  outputMessage: response
  region: $(watsonx-region)
  opVersion: $(watsonx-op-version)
  tlsClientProfile: $(watsonx-tls-client-profile)
  projectId: $(watsonx-project-id)
  cachePolicy:
    cache:
      expire:
        static:
          seconds: 60
      scope:
        narrowScope: {}
      ignoreControlDirectives: true
---
kind: InvokeWatsonxTokenize
apiVersion: api.ibm.com/v1
