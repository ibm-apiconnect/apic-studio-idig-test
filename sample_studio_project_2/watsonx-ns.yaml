---
kind: LLMProvider
apiVersion: api.ibm.com/v1
metadata:
  title: 'Watsonx Provider'
  name: watsonx-provider
  namespace: namespace-1
  version: '1.0'
  tags: []
  domain: ai-provider
  labels:
    gatewayTypes:
      - nano
spec:
  product:
    $ref: watsonx-ns:watsonx-conn-product:1.0
  provider:
    type: watsonx
    operations:
      - InvokeWatsonxModels
      - InvokeWatsonxTextGen
      - InvokeWatsonxTokenize
    apiKeySecret: watsonx-api-key
    tlsClientProfile: tls-client-profile-default:1.0.0
    projectId: project-id
    region: us-south
    opVersion: '2024-03-14'
---
