  api-spec:
    $path: api-spec.json
  policy-sequence:
    - $ref: watsonx-ns:FreeFlowPolicySequence-5hJtu:1.0
---
kind: Authenticate
apiVersion: api.ibm.com/v1
metadata:
  name: Authenticate-Gz8E3
  namespace: watsonx-ns
  version: '1.0'
  tags: []
  domain: ai-platform
  labels:
    gatewayTypes:
      - nano
spec:
  namespace: client
  operation:
    subscription: {}
---
kind: Authorize
apiVersion: api.ibm.com/v1
metadata:
  name: Authorize-XwPMi
  namespace: watsonx-ns
  version: '1.0'
  tags: []
  domain: ai-platform
  labels:
    gatewayTypes:
      - nano
spec:
  operation:
    subscription: {}
  namespace: client
---
kind: ExtractIdentity
apiVersion: api.ibm.com/v1
metadata:
  name: ExtractIdentity-hBK4W
  namespace: watsonx-ns
  version: '1.0'
  tags: []
  domain: ai-platform
  labels:
    gatewayTypes:
      - nano
spec:
  credentialType:
    apiKey:
      clientId:
        httpHeader:
          name: X-IBM-Client-Id
      clientSecret:
        httpHeader:
          name: X-IBM-Client-Secret
  namespace: client
---
kind: FreeFlowPolicySequence
apiVersion: api.ibm.com/v1
metadata:
  name: FreeFlowPolicySequence-5hJtu
  namespace: watsonx-ns
  version: '1.0'
  tags: []
  domain: ai-platform
  labels:
    gatewayTypes:
      - nano
spec:
  main:
    - $ref: watsonx-ns:watsonx-provider:1.0
    - $ref: watsonx-ns:ExtractIdentity-hBK4W:1.0
    - $ref: watsonx-ns:Authenticate-Gz8E3:1.0
    - $ref: watsonx-ns:Authorize-XwPMi:1.0
    - $ref: watsonx-ns:IBMCloudLogin-def4T:1.0
    - $ref: watsonx-ns:Parse-ty5F8:1.0
    - $ref: watsonx-ns:OperationSwitch-qwEr2:1.0
  monitoring:
    $ref: watsonx-ns:Telemetry-iOygH:1.0
  error:
    - errorType: []
      execute:
        - $ref: watsonx-ns:Throw-BvG5K:1.0
---
kind: IBMCloudLogin
apiVersion: api.ibm.com/v1
metadata:
  name: IBMCloudLogin-def4T
  namespace: watsonx-ns
  version: '1.0'
  tags: []
  domain: ai-platform
  labels:
    gatewayTypes:
      - nano
spec:
  apiKeySecret: watsonx-api-key
