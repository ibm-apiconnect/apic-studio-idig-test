  projectId: $(watsonx-project-id)
  cachePolicy:
    cache:
      expire:
        static:
          seconds: 60
      scope:
        narrowScope: {}
      ignoreControlDirectives: true
---
kind: OperationSwitch
apiVersion: api.ibm.com/v1
metadata:
  name: OperationSwitch-qwEr2
  namespace: watsonx-ns
  version: '1.0'
  tags: []
  domain: ai-platform
  labels:
    gatewayTypes:
      - nano
spec:
  cases:
    - conditions:
        - verbPath:
            path: /deployment-models
            verb: GET
      execute:
        - $ref: watsonx-ns:InvokeWatsonxModels-1Fre2:1.0
    - conditions:
        - verbPath:
            path: /text-generate
            verb: POST
      execute:
        - $ref: watsonx-ns:InvokeWatsonxTextGen-yU48r:1.0
    - conditions:
        - verbPath:
            path: /tokenize
            verb: POST
      execute:
        - $ref: watsonx-ns:InvokeWatsonxTokenize-pQr3t:1.0
---
kind: Parse
apiVersion: api.ibm.com/v1
metadata:
  name: Parse-ty5F8
  namespace: watsonx-ns
  version: '1.0'
  tags: []
  domain: ai-platform
  labels:
    gatewayTypes:
      - nano
spec:
  documentType:
    json: {}
  input: request
---
kind: Plan
apiVersion: api.ibm.com/v1
metadata:
  name: watsonx-conn-plan
  namespace: watsonx-ns
  version: '1.0'
  tags: []
  domain: ai-platform
  description: ''
spec:
  qos:
    withQuota:
      watsonx-token-weighted:
        - $ref: watsonx-ns:watsonx-token-weighted:1.0
      watsonx-default:
        - $ref: watsonx-ns:watsonx-default:1.0
  extensions:
    dp-nano-gateway:
      apiVersion: api.ibm.com/v1
      spec:
        apis:
          - $ref: watsonx-ns:watsonx-conn-api:1.0
            operations:
              - path: /deployment-models
                method: get
              - path: /text-generate
                method: post
              - path: /tokenize
                method: post
        telemetry: {}
    dp-gateway:
      apiVersion: api.ibm.com/v1
      spec:
        apis:
          - $ref: watsonx-ns:watsonx-conn-api:1.0
            operations:
              - path: /deployment-models
                method: get
              - path: /text-generate
                method: post
              - path: /tokenize
                method: post
---
kind: Product
apiVersion: api.ibm.com/v1
metadata:
  name: watsonx-conn-product
  namespace: watsonx-ns
  version: '1.0'
  tags: []
  domain: ai-platform
  description: ''
spec:
  apis:
    - $ref: watsonx-ns:watsonx-conn-api:1.0
  plans:
    - $ref: watsonx-ns:watsonx-conn-plan:1.0
---
kind: Quota
apiVersion: api.ibm.com/v1
metadata:
  name: watsonx-token-weighted
  namespace: watsonx-ns
  version: '1.0'
  tags: []
  domain: ai-platform
  description: ''
spec:
  maxRequest: 10000
  interval: 60s
  extensions:
    dp-nano-gateway:
      apiVersion: api.ibm.com/v1
      spec:
        weightExpr: $variable('aiGeneratedTokenCount')
        exceedAction: return429
        intervalOffset: 0
        dynamicValue: ''
---
kind: Quota
apiVersion: api.ibm.com/v1
metadata:
  name: watsonx-default
  namespace: watsonx-ns
  version: '1.0'
  tags: []
  domain: ai-platform
  description: ''
spec:
  maxRequest: 100
  interval: 10s
  extensions:
    dp-nano-gateway:
      apiVersion: api.ibm.com/v1
      spec:
        weightExpr: '1'
        exceedAction: return429
        intervalOffset: 0
        dynamicValue: ''
---
kind: Telemetry
apiVersion: api.ibm.com/v1
metadata:
  name: Telemetry-iOygH
  namespace: watsonx-ns
  version: '1.0'
  tags: []
  domain: ai-platform
  labels:
    gatewayTypes:
      - nano
spec:
  verbosity:
    - level: basic
      onSuccessTrimTo: none
      inboundLevel: basic
      outboundLevel: basic
      operations:
        - path: /deployment-models
          method: GET
        - path: /text-generate
          method: POST
        - path: /tokenize
          method: POST
---
kind: Throw
apiVersion: api.ibm.com/v1
