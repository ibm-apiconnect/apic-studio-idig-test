      summary: Get a post by ID
      description: Returns a single post
      tags:
        - Posts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Post ID
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Post not found
    put:
      summary: Update a post
      description: Updates a post (fake - not persisted)
      tags:
        - Posts
      parameters:
        - in: path
          name: id
          required: true
          schema:
