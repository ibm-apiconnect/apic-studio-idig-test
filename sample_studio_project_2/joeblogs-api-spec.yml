components:
  schemas:
    Post:
      type: object
      properties:
        id:
          type: integer
          description: Post ID
        userId:
          type: integer
          description: User ID who created the post
        title:
          type: string
          description: Post title
        body:
          type: string
          description: Post content
    PostInput:
      type: object
      required:
        - title
        - body
        - userId
      properties:
        userId:
          type: integer
          description: User ID who created the post
        title:
          type: string
          description: Post title
        body:
          type: string
          description: Post content
    Comment:
      type: object
      properties:
        id:
          type: integer
          description: Comment ID
        postId:
          type: integer
          description: Post ID this comment belongs to
        name:
          type: string
          description: Comment title
        email:
          type: string
          format: email
          description: Commenter's email
        body:
          type: string
          description: Comment content
    CommentInput:
      type: object
      required:
        - postId
        - name
        - email
        - body
      properties:
        postId:
          type: integer
          description: Post ID this comment belongs to
        name:
          type: string
          description: Comment title
        email:
          type: string
          format: email
          description: Commenter's email
        body:
          type: string
          description: Comment content
    Album:
      type: object
      properties:
        id:
          type: integer
          description: Album ID
        userId:
          type: integer
          description: User ID who owns the album
        title:
          type: string
          description: Album title
    AlbumInput:
      type: object
      required:
        - userId
        - title
      properties:
        userId:
          type: integer
          description: User ID who owns the album
        title:
          type: string
          description: Album title
    Photo:
      type: object
      properties:
        id:
          type: integer
          description: Photo ID
        albumId:
          type: integer
          description: Album ID this photo belongs to
        title:
          type: string
          description: Photo title
        url:
          type: string
          format: uri
          description: Photo URL
        thumbnailUrl:
          type: string
          format: uri
          description: Photo thumbnail URL
    PhotoInput:
      type: object
      required:
        - albumId
        - title
        - url
        - thumbnailUrl
      properties:
        albumId:
          type: integer
          description: Album ID this photo belongs to
        title:
          type: string
          description: Photo title
        url:
          type: string
          format: uri
          description: Photo URL
        thumbnailUrl:
          type: string
          format: uri
          description: Photo thumbnail URL
    Todo:
      type: object
      properties:
        id:
          type: integer
          description: Todo ID
        userId:
          type: integer
          description: User ID who owns the todo
        title:
          type: string
          description: Todo title
        completed:
          type: boolean
          description: Todo completion status
    TodoInput:
      type: object
      required:
        - userId
        - title
        - completed
      properties:
        userId:
          type: integer
          description: User ID who owns the todo
        title:
          type: string
          description: Todo title
        completed:
          type: boolean
          description: Todo completion status
    User:
      type: object
      properties:
        id:
          type: integer
          description: User ID
        name:
          type: string
          description: User's full name
        username:
          type: string
          description: Username
        email:
          type: string
          format: email
          description: User's email
        address:
          type: object
          properties:
            street:
              type: string
            suite:
              type: string
            city:
              type: string
            zipcode:
              type: string
            geo:
              type: object
              properties:
                lat:
                  type: string
                lng:
                  type: string
        phone:
          type: string
          description: User's phone number
        website:
          type: string
          description: User's website
        company:
          type: object
          properties:
            name:
              type: string
            catchPhrase:
              type: string
            bs:
              type: string
    UserInput:
      type: object
      required:
        - name
        - username
        - email
      properties:
        name:
          type: string
          description: User's full name
        username:
          type: string
          description: Username
        email:
          type: string
          format: email
          description: User's email
        address:
          type: object
          properties:
            street:
              type: string
            suite:
              type: string
            city:
              type: string
            zipcode:
              type: string
            geo:
              type: object
              properties:
                lat:
                  type: string
                lng:
                  type: string
        phone:
          type: string
          description: User's phone number
        website:
          type: string
          description: User's website
        company:
          type: object
          properties:
            name:
              type: string
            catchPhrase:
              type: string
            bs:
              type: string
tags:
