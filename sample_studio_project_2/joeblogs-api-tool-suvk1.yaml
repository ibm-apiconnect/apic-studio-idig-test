    - name: list_test_posts
      description: This tool retrieves all simulated posts for a specific user from
        the testing API. 1. Returns posts based on the provided user ID.
      inputSchema:
        type: object
        properties:
          userId:
            description: Filter posts by user ID
            x-parameter-location: query
            type: integer
          _limit:
            description: Limit the number of results
            x-parameter-location: query
            type: integer
          _page:
            description: Page number for pagination
            x-parameter-location: query
            type: integer
      title: Get all posts
      x-api-binding:
        operationPath: /posts
        operationMethod: GET
        api:
          $path: ./joeblogs-api-spec.yml
    - name: compose_api_post
      description: This tool creates mock posts in a tester's API. 1. It generates
        fake post records with a given title and body. 2. Ideal for prototyping
        and scenario testing. 3. No actual posts are persisted in this mock-up.
      inputSchema:
        type: object
        properties:
          userId: &a1
            type: integer
            description: User ID who created the post (e.g., 123).
          title: &a2
            type: string
            description: Post title (e.g., "My First Post").
          body: &a3
            type: string
            description: Post content (e.g., "Hello, world!").
        required:
          - userId
          - title
          - body
      title: Create a new post
      x-api-binding:
        operationPath: /posts
        operationMethod: POST
        api:
          $path: ./joeblogs-api-spec.yml
    - name: retrieve_test_user
      description: This tool fetches a single simulated user from the testing API. 1.
        Returns user information based on the provided ID.
      inputSchema:
        type: object
        properties:
          id:
            description: Todo ID
            x-parameter-location: path
            type: integer
        required:
