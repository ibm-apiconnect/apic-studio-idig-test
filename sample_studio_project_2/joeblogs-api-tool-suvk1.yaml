      x-api-binding:
        operationPath: /posts/{id}
        operationMethod: GET
        api:
          $path: ./joeblogs-api-spec.yml
    - name: update_test_user
      description: This tool updates a simulated user in the testing API. 1. Updates
        user details with a provided ID.
      inputSchema:
        type: object
        properties:
          id:
            description: The unique ID number for the user.
            x-parameter-location: path
            type: integer
